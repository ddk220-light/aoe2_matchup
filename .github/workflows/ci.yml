name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # The deployable suite runs entirely from committed artifacts (DBs/JSON).
      # Replay parsing, historical calibration archives and superseded Python
      # simulation/pipeline contracts are intentionally outside this gate;
      # none is required by the staged website runtime.
      - name: Install Python deps
        run: pip install -r requirements-ci.txt

      - name: Website Python contract
        run: |
          pytest -q \
            --ignore=tests/test_ability_registry.py \
            --ignore=tests/test_calibration_extract.py \
            --ignore=tests/test_cleanroom_champion_basics.py \
            --ignore=tests/test_hc_compare_viewer.py \
            --ignore=tests/test_sim_outcome_cache.py \
            --ignore=tests/test_simulations.py \
            --ignore=tests/test_standard_units_import.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Browser engine mechanics
        run: node --test tests/js/engine/*.test.mjs

      - name: Frontend integration tests
        run: |
          node tests/test_frontend_projectile_miss.js
          node tests/test_sim_params.js
