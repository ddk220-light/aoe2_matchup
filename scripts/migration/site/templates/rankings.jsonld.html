{#- Verbatim from apps/website/templates/rankings.html (block content). Only the text inside the
    tags is published, so keep it byte-exact (whitespace and escaping included). -#}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "Age of Empires II top units by category",
  "itemListElement": [
    {% set ns = namespace(pos=0) %}
    {% for group in rankings_overview %}{% for u in group.units %}{% set ns.pos = ns.pos + 1 %}{{ "," if ns.pos > 1 else "" }}
    { "@type": "ListItem", "position": {{ ns.pos }}, "name": {{ (u.name ~ " (" ~ u.civ ~ ")") | tojson }} }{% endfor %}{% endfor %}
  ]
}
</script>
